<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperatura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  /* aplica o tema salvo (ou o do sistema) antes de pintar a página */
  try { var salvo = localStorage.getItem("tema"); } catch (e) {}
  document.documentElement.dataset.tema = salvo || (matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro");
</script>
<link rel="stylesheet" href="style.css">
</head>
<body data-estado="ameno">
<button class="tema" id="tema" type="button" aria-label="Ativar modo escuro">
  <svg class="lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
</button>

<div class="fundo" id="fundo">
  <div class="camada frio"></div>
  <div class="camada ameno"></div>
  <div class="camada quente"></div>
  <canvas id="particulas"></canvas>
</div>

<header class="hero" id="hero">

  <div class="conteudo">
    <div class="temperatura"><span id="valor">--</span><span class="unidade">°C</span></div>
    <p id="status" aria-live="polite"></p>
  </div>

  <a class="rolar" href="#ajustes">Ajustar limites<span class="seta"></span></a>
</header>

<section class="ajustes" id="ajustes">
  <h2>Limites de temperatura</h2>
  <p>Defina a partir de quantos graus é frio e quente. Entre os dois, o clima é ameno.</p>

  <form id="form-limites">
    <label>Temperatura fria (°C)
      <input type="number" id="fria" step="any" value="15" required>
    </label>
    <label>Temperatura máxima (°C)
      <input type="number" id="maxima" step="any" value="30" required>
    </label>
    <p id="erro" role="alert"></p>
    <button type="submit">Salvar limites</button>
  </form>
</section>

<script src="termometro.js"></script>
</body>
</html>
