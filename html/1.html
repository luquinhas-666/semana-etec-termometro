            <!-- place footer here -->
        </footer>
<script>



        // Sistema de pesquisa
       const camposPesquisa = [
    document.getElementById("search"),
    document.getElementById("searchInput")
];

const cards = document.querySelectorAll(".card");

function filtrarProjetos(texto) {
    const termo = texto.trim().toLocaleLowerCase("pt-BR");

    cards.forEach(card => {
        const conteudo = card.textContent
            .toLocaleLowerCase("pt-BR");

        card.style.display = conteudo.includes(termo)
            ? ""
            : "none";
    });
}

camposPesquisa.forEach(campo => {
    campo.addEventListener("input", function () {
        filtrarProjetos(this.value);

        // Mantém os campos sincronizados
        camposPesquisa.forEach(outro => {
            if (outro !== this) {
                outro.value = this.value;
            }
        });
    });
});

document.getElementById("searchButton")
    .addEventListener("click", () => {
        filtrarProjetos(
            document.getElementById("searchInput").value
        );
    });
</script>
